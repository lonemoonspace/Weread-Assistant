# 每月检查一次依赖更新，次要版本与补丁合并为一个 Pull Request；安全更新不受此限制
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # 镜像固定使用 Node.js 的 LTS 主版本（node:24-alpine），不提主版本升级：奇数版本不是 LTS，
    # 换到下一个 LTS 时手动修改 Dockerfile。24 的补丁版本随 24-alpine 标签在每次构建时获得
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
