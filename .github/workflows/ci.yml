# Pull Request 与 main 分支的检查：自查、ESLint、单元测试、各项 smoke、依赖安全检查、工作流检查，
# 以及 amd64 与 arm64 镜像的构建与运行检查。第三方 Action 按提交固定版本，升级时同时更新注释中的版本号
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  checks:
    name: 自查与 smoke（通知、配置、面板）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 自查（语法、第三方文件校验值、页面约定）
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: 单元测试
        run: npm run test:unit:coverage
      - name: 检查 docker-compose.yml
        run: docker compose config --quiet
      - run: npm run test:notify
      - run: npm run test:config
      - run: npm run test:panel

  audit:
    name: 依赖安全检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 镜像中安装的依赖没有高危漏洞
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: 阅读流程与页面（Selenium）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 外部 Selenium 的兼容性测试：镜像默认使用内置浏览器，docker-compose.yml 中已没有 Selenium 服务。
    # 镜像版本写在 ci/selenium.Dockerfile 中，由 Dependabot 跟踪
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 使用主机网络，容器中的浏览器才能访问本机的模拟页面与面板
      - name: 启动 Selenium
        run: |
          SELENIUM_IMAGE="$(sed -n 's/^FROM //p' ci/selenium.Dockerfile | head -n 1)"
          docker run -d --name selenium --network host --shm-size 2g "$SELENIUM_IMAGE"
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
              exit 0
            fi
            sleep 2
          done
          docker logs selenium
          exit 1
      - name: 阅读流程 smoke（本地模拟页面）
        run: npm run test:reader
        env:
          SELENIUM_URL: http://localhost:4444
      - name: 页面 smoke
        run: npm run test:ui
        env:
          SELENIUM_URL: http://localhost:4444
          UI_SMOKE_SCREENSHOTS: ${{ runner.temp }}/ui-smoke
      - name: 上传页面截图
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-screenshots
          path: ${{ runner.temp }}/ui-smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Selenium 日志
        if: failure()
        run: docker logs selenium

  # 工作流文件的检查（语法、表达式、shell 脚本）
  actionlint:
    name: 工作流检查（actionlint）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # rhysd/actionlint:1.7.12，按摘要固定
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # 发布的两个架构在各自的原生 runner 上构建与发布相同的镜像，检查启动、健康检查、运行用户、数据目录与停止，
  # 再在容器中用内置浏览器（Alpine 的 Chromium 与 chromedriver）跑阅读流程 smoke。
  # 原生运行时阅读节奏的断言与真机一致；发布流程（release.yml）在发布前做同样的检查
  image:
    name: 镜像构建与检查（${{ matrix.arch }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 构建镜像
        run: node scripts/docker-image.js build --platform "linux/${{ matrix.arch }}" --tag ci
      - name: 镜像体积
        run: |
          size="$(docker image inspect -f '{{.Size}}' docker.io/lonemoonspace/weread-assistant:ci)"
          echo "linux/${{ matrix.arch }} 镜像解压后 $((size / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 检查 CLI、健康检查、运行用户、数据目录与停止
        run: npm run test:runtime
        env:
          RUNTIME_SMOKE_IMAGE: docker.io/lonemoonspace/weread-assistant:ci
          RUNTIME_SMOKE_ARCH: ${{ matrix.arch }}
      # 测试脚本不在镜像中，只读挂载；以 node 用户运行，tini 回收浏览器进程
      - name: 阅读流程 smoke（内置浏览器）
        run: >-
          docker run --rm --user node --entrypoint /sbin/tini
          -v "$PWD/scripts:/app/scripts:ro" -e SELENIUM_URL=
          docker.io/lonemoonspace/weread-assistant:ci -- node scripts/reader-smoke.js
