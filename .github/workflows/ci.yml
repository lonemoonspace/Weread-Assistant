# Pull Request 与 main 分支的检查：自查、ESLint、单元测试、各项 smoke、依赖安全检查与镜像运行检查。
# 第三方 Action 按提交固定版本，升级时同时更新注释中的版本号
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  checks:
    name: 自查与 smoke（通知、配置、面板）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 自查（语法、第三方文件校验值、页面约定）
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: 单元测试
        run: npm run test:unit:coverage
      - name: 检查 docker-compose.yml
        run: docker compose config --quiet
      - run: npm run test:notify
      - run: npm run test:config
      - run: npm run test:panel

  audit:
    name: 依赖安全检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 镜像中安装的依赖没有高危漏洞
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: 阅读流程与页面（Selenium）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 外部 Selenium 的兼容性测试：镜像默认使用内置浏览器，docker-compose.yml 中已没有 Selenium 服务。
      # 这个标签不在 Dependabot 的检查范围内，需要手动升级
      SELENIUM_IMAGE: selenium/standalone-chromium:4.51.0-20261010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # 使用主机网络，容器中的浏览器才能访问本机的模拟页面与面板
      - name: 启动 Selenium
        run: |
          docker run -d --name selenium --network host --shm-size 2g "$SELENIUM_IMAGE"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
              exit 0
            fi
            sleep 2
          done
          docker logs selenium
          exit 1
      - name: 阅读流程 smoke（本地模拟页面）
        run: npm run test:reader
        env:
          SELENIUM_URL: http://localhost:4444
      - name: 页面 smoke
        run: npm run test:ui
        env:
          SELENIUM_URL: http://localhost:4444
          UI_SMOKE_SCREENSHOTS: ${{ runner.temp }}/ui-smoke
      - name: 上传页面截图
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-screenshots
          path: ${{ runner.temp }}/ui-smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Selenium 日志
        if: failure()
        run: docker logs selenium

  # 镜像中的内置浏览器（Alpine 的 Chromium 与 chromedriver）：在 amd64 与 arm64 的原生 runner 上分别构建镜像，
  # 在容器中用内置浏览器跑阅读流程 smoke。arm64 是发布的架构，原生运行时阅读节奏的断言与真机一致
  builtin-browser:
    name: 阅读流程（镜像内置浏览器，${{ matrix.arch }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 构建镜像
        run: docker build -t weread-assistant:builtin-browser .
      # 测试脚本不在镜像中，只读挂载；以 node 用户运行，tini 回收浏览器进程
      - name: 阅读流程 smoke（内置浏览器）
        run: >-
          docker run --rm --user node --entrypoint /sbin/tini
          -v "$PWD/scripts:/app/scripts:ro" -e SELENIUM_URL=
          weread-assistant:builtin-browser -- node scripts/reader-smoke.js

  # 只发布 linux/arm64：在原生 arm64 runner 上构建并运行与发布相同的镜像
  image:
    name: arm64 镜像构建与运行检查
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 构建 arm64 镜像
        run: node scripts/docker-image.js build --platform linux/arm64 --tag ci
      - name: 检查 CLI、健康检查、运行用户、数据目录与停止
        run: npm run test:runtime
        env:
          RUNTIME_SMOKE_IMAGE: docker.io/lonemoonspace/weread-assistant:ci
          RUNTIME_SMOKE_ARCH: arm64
