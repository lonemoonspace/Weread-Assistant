# 发布 linux/amd64 与 linux/arm64 多架构镜像到 Docker Hub（docker.io/lonemoonspace/weread-assistant）：
# - main 分支的 CI 通过后发布 dev；package.json 的版本还没有对应的 tag（如 v0.1.0）时，同时发布 0.1.0 与 latest，
#   并在该提交上创建 tag 与 GitHub Release（合并改版本号的 Pull Request 即发布，不需要手动推送 tag）
# - 推送版本 tag（须与 package.json 的 version 一致）时发布 0.1.0 与 latest，并创建 GitHub Release
# - 在其他分支上手动触发（workflow_dispatch）时只发布 dev，用于验证发布流程本身
# 两个架构在各自的原生 runner 上构建并检查，都通过后才合成清单、打标签（见 image.yml）；GitHub Release 最后创建。
# 需要在仓库 Settings → Secrets and variables → Actions 中添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN
# （Docker Hub 的 Personal access token，权限 Read & Write）
name: 发布镜像

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref || 'dev' }}
  cancel-in-progress: false

jobs:
  meta:
    name: 确定版本与标签
    # 只处理本仓库 main 分支推送后通过的 CI；Pull Request 触发的 CI 不发布
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # CI 通过的那个提交
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 确定镜像标签
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          release=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME 与 package.json 的版本 $version 不一致，应为 v$version"
              exit 1
            fi
            tags="$version,latest"
            release=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # 版本号还没有 tag：这个提交就是新版本，发布正式版本并创建 tag；dev 一并更新
            if out="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" 2>&1)"; then
              tags="dev"
            elif printf '%s' "$out" | grep -q "HTTP 404"; then
              tags="$version,latest,dev"
              release=true
            else
              echo "::error::无法查询 tag v$version：$out"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # 在其他分支上手动触发：只发布 dev，用于验证发布流程，不创建 tag 与 Release
            tags="dev"
            version="$version-dev"
            echo "::notice::从分支 $GITHUB_REF_NAME 手动发布 dev，用于验证发布流程"
          else
            echo "::error::只从 main 分支发布 dev，或从版本 tag 发布正式版本（当前为 $GITHUB_REF）"
            exit 1
          fi
          {
            echo "sha=$HEAD_SHA"
            echo "version=$version"
            echo "tags=$tags"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "发布 docker.io/lonemoonspace/weread-assistant 的 $tags（提交 $HEAD_SHA）" >> "$GITHUB_STEP_SUMMARY"

      # 发布说明取 CHANGELOG.md 中该版本的一节；没有时在构建前失败，不推送镜像
      - name: 检查发布说明
        if: steps.meta.outputs.release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # awk 程序中的 $0 由 awk 解释
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " version " ") == 1 || $0 == "## " version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 中没有 $VERSION 的说明"
            exit 1
          fi

      - name: 检查 Docker Hub 凭据
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 中添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN"
            exit 1
          fi

  image:
    name: 镜像
    needs: meta
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.meta.outputs.sha }}
      version: ${{ needs.meta.outputs.version }}
      tags: ${{ needs.meta.outputs.tags }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # 从 main 发布时由 Release 在该提交上创建 tag。用 GITHUB_TOKEN 创建的 tag 不会再触发本工作流
  release:
    name: 创建 GitHub Release
    needs: [meta, image]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.sha }}
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
          HEAD_SHA: ${{ needs.meta.outputs.sha }}
        run: |
          # shellcheck disable=SC2016 # awk 程序中的 $0 由 awk 解释
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " version " ") == 1 || $0 == "## " version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "GitHub Release v$VERSION 已存在，跳过"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "v$VERSION" --verify-tag --title "WeReadAssistant $VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" --target "$HEAD_SHA" --title "WeReadAssistant $VERSION" --notes-file release-notes.md
          fi
