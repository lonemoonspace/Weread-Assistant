<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeReadAssistant</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/panel.css">
</head>
<body>
  <main class="card">
    <header class="row">
      <h1>WeReadAssistant</h1>
      <button id="logout" type="button" class="secondary">退出登录</button>
    </header>
    <p class="muted">版本 <span id="version">-</span></p>
    <p>面板正在开发中：账号管理、阅读计划、运行记录与扫码登录会在后续版本中加入。</p>

    <section>
      <h2>修改面板密码</h2>
      <p id="password-from-env" class="muted" hidden>面板密码由环境变量 PANEL_PASSWORD 设置，请修改该变量后重启面板。</p>
      <form id="password-form" hidden>
        <label for="current">当前密码</label>
        <input id="current" type="password" autocomplete="current-password" required>
        <label for="next">新密码</label>
        <input id="next" type="password" autocomplete="new-password" required>
        <button type="submit">保存</button>
        <p id="password-message" class="message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="assets/api.js"></script>
  <script src="assets/index.js"></script>
</body>
</html>
