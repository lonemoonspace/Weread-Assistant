<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · WeReadAssistant</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/vendor/pico.min.css">
  <link rel="stylesheet" href="assets/panel.css">
</head>
<body>
  <main class="container login-page">
    <article>
      <h1>WeReadAssistant</h1>
      <form id="login-form">
        <label for="password">面板密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">登录</button>
        <p id="message" class="error-text" role="alert"></p>
      </form>
      <p class="muted">非微信读书官方工具。首次启动的初始密码见面板日志：<code>docker compose logs app | grep 面板初始密码</code></p>
    </article>
  </main>
  <script src="assets/api.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
