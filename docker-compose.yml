services:
  # Web 面板：docker compose up -d 启动，浏览器访问 http://127.0.0.1:26868/
  # 首次启动的初始密码：docker compose logs app | grep 面板初始密码
  # 镜像中已包含浏览器（Chromium 与 chromedriver，无界面模式），不需要单独的 Selenium 容器
  app:
    # 固定版本时在同目录的 .env 中写 WEREAD_ASSISTANT_TAG=0.1.3；dev 为 main 分支的最新构建
    image: lonemoonspace/weread-assistant:${WEREAD_ASSISTANT_TAG:-latest}
    restart: unless-stopped
    # 停止时面板先结束进行中的阅读（关闭浏览器，最长 15 秒）
    stop_grace_period: 30s
    # 只允许本机访问（经同一主机上的反向代理访问时用这个）；需要从局域网其他设备直接访问时改为 "26868:26868"
    ports:
      - "127.0.0.1:26868:26868"
    environment:
      - TZ=Asia/Shanghai
      # 改用自己部署的 Selenium 时取消注释（首次启动时写入面板的全局默认配置，之后在面板设置中修改）
      # - SELENIUM_URL=http://selenium:4444
      # - PANEL_PASSWORD=change-me
      # - PANEL_TRUST_PROXY=true
      # - PANEL_BASE_PATH=/weread/
      # - PANEL_PUBLIC_URL=https://example.com/weread/ # 扫码推送中附带面板链接
    volumes:
      - ./data:/app/data
    # 容器默认使用宿主机的 DNS。宿主机解析微信读书或通知服务较慢时，可以取消注释指定 DNS
    # dns:
    #   - 223.5.5.5
